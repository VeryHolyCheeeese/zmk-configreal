# Shield-level settings for baller.

# ZMK Studio (the studio-rpc-usb-uart snippet in build.yaml provides the USB transport)
CONFIG_ZMK_STUDIO=y
# Unlocked while building; remove this line to require a &studio_unlock key
CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment to enable the encoder
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y
